# This file uses environment variables
# to override any settings add a file called '.env'
# with new environment variable values
# example: "DATABASE_USERNAME=NikZy"
networks:
  hilfling-network: # Used for internal networking
    driver: bridge

volumes:
  db-data: # Data volume for the database (dev only)
  traefik-certs: # Let's Encrypt cert storage — must persist across restarts

services:
  traefik:
    image: "traefik:v3.7.12"
    container_name: "traefik"
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=fg-web@samfundet.no"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certs:/letsencrypt"
    networks:
      - hilfling-network
    labels:
      - "traefik.enable=true"
      # Dashboard is gone. To re-add later:
      # --api=true (NOT --api.insecure=true), a router protected by
      # basic auth, routed through :443 like the backend router below.

  backend:
    container_name: backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - hilfling-network
    depends_on:
      - traefik
    expose:
      - "8000"
    environment:
      # Prefer the external Azure/Postgres host configured in the deployment env file.
      # Fall back to the local docker-compose postgres service only for local development.
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/hilflingdb}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-hilfling}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/hilflingdb}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-hilfling}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8888}
      AUTH_CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ALLOWED_ORIGINS:-http://localhost:8888}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`fg-beta.samfundet.no`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  postgres:
    container_name: hilflingdb
    profiles:
      - dev
    build:
      context: .
      dockerfile: postgres/Dockerfile
    restart: unless-stopped
    networks:
      - hilfling-network
    volumes:
      - "db-data:/var/lib/postgresql/data" # Database volume
        #- "./postgres/sql:/base-sql" # Think this was init sql schema?
    expose:
      - "5432"
    environment:
      # Use env variable if exists, fallback to hilfling
      POSTGRES_USER: ${DATABASE_USERNAME:-hilfling}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      LISTENING_PORT: ${LISTENING_PORT-8000}

  pgadmin:
    container_name: pgadmin
    restart: unless-stopped
    profiles:
      - dev
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-password}
    ports:
      - ${PGADMIN_PORT:-5050}:80
    networks:
      - hilfling-network